name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip check
      - name: "Run tests (model contracts + pipeline: operator/data/training/metrics/baseline)"
        run: pytest test/ -v
      - name: Validate Bash orchestrator syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/run_all.sh
